==============================================
PROSPER CHAT WIDGET - EMBED CODE
==============================================

Copy this entire block and paste it on your website
right before the closing </body> tag.

REPLACE: "YOUR-PROJECT.vercel.app" with your actual Vercel URL

==============================================
-->

<script>
  (function() {
    // Configuration
    var config = {
      widgetUrl: 'https://YOUR-PROJECT.vercel.app',  // CHANGE THIS to your Vercel URL
      position: 'bottom-right',  // Options: 'bottom-right', 'bottom-left'
      autoOpen: false,  // Set to true to auto-open after 3 seconds
      zIndex: 9999
    };

    var widgetOrigin = new URL(config.widgetUrl).origin;

    // The iframe is only as large as the widget needs, so it never blocks
    // clicks on the rest of the host page. It grows when the chat opens.
    var COLLAPSED = { width: '100px', height: '100px' };
    var EXPANDED = { width: 'min(420px, 100vw)', height: 'min(710px, 100vh)' };

    var iframe = document.createElement('iframe');
    iframe.src = config.widgetUrl;
    iframe.id = 'prosper-chat-widget';
    iframe.title = 'Prosper Manufacturing chat';
    iframe.setAttribute('allowtransparency', 'true');

    iframe.style.cssText = [
      'position: fixed',
      'bottom: 0',
      config.position === 'bottom-left' ? 'left: 0' : 'right: 0',
      'width: ' + COLLAPSED.width,
      'height: ' + COLLAPSED.height,
      'border: none',
      'z-index: ' + config.zIndex,
      'background: transparent',
      'color-scheme: normal',
      'transition: width 0.2s ease, height 0.2s ease'
    ].join(';');

    function setSize(open) {
      var size = open ? EXPANDED : COLLAPSED;
      iframe.style.width = size.width;
      iframe.style.height = size.height;
    }

    function mount() {
      document.body.appendChild(iframe);
      if (config.autoOpen) {
        setTimeout(function() {
          iframe.contentWindow.postMessage({ type: 'openChat' }, widgetOrigin);
        }, 3000);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mount);
    } else {
      mount();
    }

    // The widget reports open/close so the iframe can resize to match.
    window.addEventListener('message', function(event) {
      if (event.origin !== widgetOrigin) return;
      if (!event.data || event.data.type !== 'prosper-chat:toggle') return;

      setSize(event.data.open);

      // Optional: hook your analytics in here.
      // if (event.data.open) { gtag('event', 'chat_opened'); }
    });
  })();
</script>
